services:
  litterbox-windows:
    image: dockurr/windows
    container_name: litterbox-windows
    environment:
      VERSION: "10"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "75G"
      USERNAME: "litterbox"
      PASSWORD: "${SANDBOX_PASSWORD:?Set SANDBOX_PASSWORD in .env or environment}"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 127.0.0.1:8006:8006
      - 127.0.0.1:3389:3389/tcp
      - 127.0.0.1:3389:3389/udp
      - 127.0.0.1:1337:1337
      - 127.0.0.1:8080:8080
    volumes:
      - ./windows:/storage
      - ./oem:/oem:ro
      - ./share:/data
    restart: always
    stop_grace_period: 2m
