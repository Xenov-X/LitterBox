name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Exclude paths from Windows Defender
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          $pydir = (python -c "import sys; print(sys.prefix)")
          Add-MpPreference -ExclusionPath "$pydir"
          Add-MpPreference -ExclusionPath "$env:TEMP"
        shell: pwsh

      - name: Install Python deps
        run: pip install -r requirements.txt pytest-timeout

      - name: Run tests
        timeout-minutes: 5
        run: pytest tests/ -v --tb=short --timeout=60
